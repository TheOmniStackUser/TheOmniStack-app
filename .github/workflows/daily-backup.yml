name: Daily System Backup

on:
  schedule:
    - cron: '13 19 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Sanitize Secrets
        env:
          SECRET_AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          SECRET_AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          SECRET_AWS_REGION: ${{ secrets.AWS_REGION }}
          SECRET_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_AWS_BUCKET_NAME: ${{ secrets.AWS_BUCKET_NAME }}
          SECRET_BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          SECRET_RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SECRET_ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
        run: |
          trim() {
            local var="$*"
            local old_var=""
            while [ "$var" != "$old_var" ]; do
              old_var="$var"
              var="${var#"${var%%[![:space:]]*}"}"
              var="${var%"${var##*[![:space:]]}"}"
              var="${var#\'}"
              var="${var%\'}"
              var="${var#\"}"
              var="${var%\"}"
            done
            printf "%s" "$var"
          }
          export_env() {
            local name="$1"
            local value="$(trim "$2")"
            echo "$name=$value" >> "$GITHUB_ENV"
            echo "::add-mask::$value"
          }
          
          export_env AWS_ACCESS_KEY_ID "$SECRET_AWS_ACCESS_KEY_ID"
          export_env AWS_SECRET_ACCESS_KEY "$SECRET_AWS_SECRET_ACCESS_KEY"
          export_env AWS_REGION "$SECRET_AWS_REGION"
          export_env DATABASE_URL "$SECRET_DATABASE_URL"
          export_env SOURCE_S3_BUCKET "$SECRET_AWS_BUCKET_NAME"
          export_env BACKUP_S3_BUCKET "$SECRET_BACKUP_S3_BUCKET"
          export_env RESEND_API_KEY "$SECRET_RESEND_API_KEY"
          export_env ADMIN_EMAIL "$SECRET_ADMIN_EMAIL"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run Backup Script
        run: |
          TIMESTAMP=$(date +"%Y-%m-%d_%H-%M-%S")
          BACKUP_DIR="/tmp/theomnistack_backup_$TIMESTAMP"
          DB_DUMP_FILE="$BACKUP_DIR/database_$TIMESTAMP.sql"
          
          echo "Starting backup process at $TIMESTAMP..."
          mkdir -p "$BACKUP_DIR"
          
          echo "Dumping PostgreSQL database (using Postgres 17)..."
          if docker run --rm postgres:17-alpine pg_dump "$DATABASE_URL" > "$DB_DUMP_FILE" 2> error.log; then
              echo "Database dump successful."
              gzip "$DB_DUMP_FILE"
              DB_DUMP_FILE="$DB_DUMP_FILE.gz"
          else
              echo "Error: Database dump failed!"
              # Read error, remove quotes/newlines, truncate to 250 chars for safe JSON insertion
              ERR_MSG=$(cat error.log | tr -d '"' | tr -d "'" | tr '\n' ' ' | cut -c 1-250)
              echo "Details: $ERR_MSG"
              curl -s -X POST https://api.resend.com/emails \
                -H "Authorization: Bearer $RESEND_API_KEY" \
                -H "Content-Type: application/json" \
                -d '{
                  "from": "TheOmniStack Team <noreply@theomnistack.de>",
                  "to": "'"$ADMIN_EMAIL"'",
                  "subject": "❌ TheOmniStack Backup Failed",
                  "html": "<p>The automated backup failed during the database dump.</p><p><strong>Error details:</strong> '"$ERR_MSG"'</p>"
                }'
              exit 1
          fi
          
          echo "Uploading database backup to S3..."
          if aws s3 cp "$DB_DUMP_FILE" "s3://$BACKUP_S3_BUCKET/database/database_$TIMESTAMP.sql.gz"; then
              echo "Database upload successful."
          else
              echo "Error: Database S3 upload failed!"
              exit 1
          fi
          
          echo "Syncing S3 documents..."
          if aws s3 sync "s3://$SOURCE_S3_BUCKET" "s3://$BACKUP_S3_BUCKET/documents/"; then
              echo "S3 documents sync successful."
          else
              echo "Error: S3 documents sync failed!"
              exit 1
          fi
          
          echo "Sending success notification to $ADMIN_EMAIL..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{
              "from": "TheOmniStack Team <noreply@theomnistack.de>",
              "to": "'"$ADMIN_EMAIL"'",
              "subject": "✅ TheOmniStack Backup Successful",
              "html": "<p>The automated system backup completed successfully at '"$TIMESTAMP"'.</p>"
            }')
          echo "Resend API Response: $RESPONSE"
